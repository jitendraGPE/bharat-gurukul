<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharat: Rooted in Heritage, Inspired for the Future</title>
<meta name="description" content="Twelve Sunday mornings from the Vedas to the Buddha, for everyone. Free, and run entirely by volunteers.">
<meta name="theme-color" content="#9e2a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bharat">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Mukta:wght@400;600;700&family=Tiro+Devanagari+Sanskrit&display=swap">
<style>
:root{
  --paper:#faf5ea; --raised:#fffdf8; --ink:#2a1a12; --muted:#6b5646; --line:#d9c9ae;
  --kumkum:#9e2a2b; --saffron:#e8871e; --haldi:#e9b949; --peacock:#1f5f6b;
  --on-kumkum:#fffdf8; --on-peacock:#fffdf8; --on-saffron:#2a1a12; --on-haldi:#2a1a12;
  --ok:#2c6e49; --ok-bg:#e3f0e6; --warn-bg:#f7eac9; --need-bg:#f6d5cc; --wa:#15803d;
  --shadow:0 1px 3px rgba(42,26,18,.1);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1d1713; --raised:#27201a; --ink:#f3ece3; --muted:#c3ab93; --line:#4a3b2d;
    --kumkum:#e0736a; --saffron:#f0a04a; --haldi:#e9c46a; --peacock:#6fb7c2;
    --on-kumkum:#1d1713; --on-peacock:#1d1713; --on-saffron:#1d1713; --on-haldi:#1d1713;
    --ok:#8fd1a8; --ok-bg:#1c3326; --warn-bg:#3a2f16; --need-bg:#40221d; --wa:#4ec27e;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Mukta','Segoe UI',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--kumkum)}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:'Fraunces',Georgia,serif;font-weight:600}
.dev{font-family:'Tiro Devanagari Sanskrit','Noto Serif Devanagari',serif}
.eb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--kumkum)}
.muted{color:var(--muted)} .small{font-size:14px}
:focus-visible{outline:2px solid var(--kumkum);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px 12px;background:var(--kumkum);color:var(--on-kumkum)}
header.top .t{flex:1;display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;white-space:nowrap;min-width:0}
header.top .t span{overflow:hidden;text-overflow:ellipsis}
header.top :focus-visible{outline-color:var(--on-kumkum)}
.iconbtn{min-width:44px;min-height:44px;border:0;background:transparent;color:inherit;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{max-width:720px;margin:0 auto;padding:18px 16px 28px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.page{animation:none}}
nav.tabs{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--raised);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 6px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;min-height:52px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--kumkum)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--kumkum);border-color:var(--kumkum);color:var(--on-kumkum)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid currentColor;color:inherit}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.15;margin:6px 0 12px}
h2{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.2;margin:26px 0 8px;scroll-margin-top:64px}
h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;margin:18px 0 6px}
p{margin:0 0 12px} ul{padding-left:20px;margin:0 0 12px} li{margin-bottom:4px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.band{border-radius:12px;padding:14px 16px;margin:12px 0}
.b-saffron{background:var(--saffron);color:var(--on-saffron)} .b-haldi{background:var(--haldi);color:var(--on-haldi)}
.b-kumkum{background:var(--kumkum);color:var(--on-kumkum)} .b-peacock{background:var(--peacock);color:var(--on-peacock)}
.band .eb,.b-kumkum .eb,.b-peacock .eb,.b-saffron .eb,.b-haldi .eb{color:inherit;opacity:.92}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{margin:-18px -16px 0;background:var(--kumkum);color:var(--on-kumkum);padding:22px 18px}
.hero .top{display:flex;align-items:flex-end;gap:12px}
.hero .big{font-family:'Fraunces',serif;font-weight:600;font-size:64px;line-height:.95}
.hero .sub{font-family:'Fraunces',serif;font-weight:600;font-size:22px;line-height:1.2;margin-top:10px}
.hero .tag{font-style:italic;color:var(--haldi);margin-top:4px}
.verbs{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--haldi);margin:12px 0 4px}
@media (prefers-color-scheme: dark){.hero .tag,.verbs{color:var(--on-kumkum)}}
.flag{flex-shrink:0}
.count{display:flex;gap:16px;align-items:center}
.count .n{font-family:'Fraunces',serif;font-weight:600;font-size:56px;line-height:1}
.count .l{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.arc{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;margin:6px 0 2px}
.arc a{display:block;text-decoration:none}
.arc i{display:block;height:34px;border-radius:999px 999px 0 0;border:1.5px solid var(--line)}
.arc a.next i{height:46px;border-color:var(--kumkum)}
.arc span{display:block;text-align:center;font-size:10px;font-weight:700;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;padding:14px;border-radius:12px;text-decoration:none;min-height:88px}
.tile b{display:block;font-family:'Fraunces',serif;font-size:17px;line-height:1.2;margin-bottom:2px}
.tile span{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Fraunces',serif;font-size:26px;line-height:1.1;color:var(--kumkum)}
.stat span{font-size:12px;color:var(--muted)}
.mhead{margin:-18px -16px 0;padding:22px 16px 18px;border-radius:0 0 26px 26px}
.mhead .num{font-family:'Fraunces',serif;font-weight:600;font-size:48px;line-height:1;opacity:.9}
.mhead .ttl{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.1}
.chips{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none}
.chips a{flex-shrink:0;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--raised);font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);min-height:36px;display:inline-flex;align-items:center}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--warn-bg);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.verse{margin:0 0 12px}.verse .v{font-style:italic;font-size:17px}.verse .s{font-size:13px;font-weight:700;color:var(--kumkum)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.agenda{list-style:none;padding:0;margin:0;position:relative}
.agenda li{display:grid;grid-template-columns:54px 1fr;gap:12px;margin:0;padding:0 0 14px;position:relative}
.agenda li:before{content:"";position:absolute;left:62px;top:10px;bottom:0;width:2px;background:var(--line)}
.agenda li:last-child:before{display:none}
.agenda .tm{font-weight:700;color:var(--kumkum);font-size:14px;padding-top:2px;text-align:right}
.agenda .bx{background:var(--raised);border:1px solid var(--line);border-left:0;border-radius:12px;padding:10px 14px;position:relative;margin-left:8px}
.agenda .bx:before{content:"";position:absolute;left:-15px;top:8px;width:12px;height:16px;border-radius:99px 99px 0 0;background:var(--c,var(--saffron))}
.agenda .nm{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.agenda .tp{font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.25}
.agenda .sub{font-size:14px}
.agenda .cir{display:grid;gap:6px;margin-top:6px}
.agenda .cir div{font-size:14px;padding:6px 10px;border-radius:8px}
.game{border-radius:12px;padding:12px 14px;margin:10px 0}
.qz{margin:14px 0}.qz .qq{font-weight:700;margin-bottom:6px}
.qz .opts{display:grid;gap:6px}
.qz button.o{text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:600}
.qz button.o.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qz button.o.wrong{background:var(--need-bg);border-color:var(--kumkum)}
.qz .why{font-size:14px;margin-top:4px;color:var(--muted)}
.score{font-family:'Fraunces',serif;font-weight:600;font-size:22px}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.ticks button{aspect-ratio:1;min-height:30px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font-size:12px;color:var(--muted);cursor:pointer;padding:0}
.ticks button[aria-pressed="true"]{background:var(--saffron);color:var(--on-saffron);border-color:var(--saffron);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--saffron);border-radius:99px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raised);font-size:20px;cursor:pointer}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-size:18px}
.role{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.role .info{flex:1;min-width:0}.role .names{font-size:13px;color:var(--muted)}
.meter{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--need-bg);white-space:nowrap}
.meter.full{background:var(--ok-bg);color:var(--ok)}
.pager2{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.tl .mk{width:22px;height:32px;border-radius:999px 999px 0 0;flex-shrink:0;margin-top:2px}
.tl a{text-decoration:none;color:var(--ink)}
.tl .when{font-size:13px;color:var(--muted)}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input.f,select.f,textarea.f{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--muted);border-radius:10px;background:var(--raised)}
textarea.f{min-height:110px}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.check input{width:22px;height:22px;margin-top:2px;flex-shrink:0}
.notice{background:var(--warn-bg);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;z-index:20;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.drawer{position:fixed;inset:0;z-index:15;display:none;background:rgba(0,0,0,.45)}
.drawer.open{display:block}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--paper);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px}
.menu a{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:44px;font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="dhwaj" viewBox="0 0 40 48">
    <rect x="3" y="2" width="3" height="46" rx="1.5" fill="#7a4a1c"/>

  </symbol>
</svg>
<header class="top">
  <div class="t"><svg class="flag" width="26" height="32" role="img" aria-label="Bhagwa Dhwaj"><use href="#dhwaj"/></svg><span id="topTitle">Bharat</span></div>
  <button class="iconbtn" id="shareBtn" aria-label="Share on WhatsApp">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
  </button>
</header>
<main id="main" tabindex="-1"><div class="page" id="page"><p class="muted">Loading…</p></div></main>
<nav class="tabs" aria-label="Main">

  <a href="#year" data-tab="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Year</a>

  <a href="#seva" data-tab="seva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>Volunteer</a>

</nav>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="More"><div class="panel" id="drawerPanel"></div></div>

<script>
(function () {
  'use strict';
  var D = null, LIVE = null;
  var $ = function (id) { return document.getElementById(id); };
  var COLS = { saffron: 'var(--saffron)', haldi: 'var(--haldi)', kumkum: 'var(--kumkum)', peacock: 'var(--peacock)' };
  var CIRCLE_COL = { 'Bal Gurukul': 'b-saffron', 'Yuva Sabha': 'b-haldi', 'Karma Sabha': 'b-peacock', 'Vriddha Sabha': 'b-kumkum' };
  function FLAG(w, h) { return '<svg class="flag" width="' + w + '" height="' + h + '" role="img" aria-label="Bhagwa Dhwaj"><use href="#dhwaj"/></svg>'; }

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  var ME = load('bg_me', null), MINE = load('bg_mine', { rsvp: {}, seva: {} }), TICKS = load('bg_ticks', {}), QUIZ = load('bg_quiz', {});

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove('show'); }, 2800); }
  function digits(s) { return String(s || '').replace(/\D/g, ''); }
  function online() { return !!(D && D.scriptUrl); }

  var PREVIEW = /[?&]today=(\d{4}-\d{2}-\d{2})/.exec(location.search);
  function today() { var d = PREVIEW ? new Date(PREVIEW[1] + 'T00:00:00') : new Date(); d.setHours(0, 0, 0, 0); return d; }
  function dateOf(m) { var p = m.date.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function daysTo(m) { return Math.round((dateOf(m) - today()) / 864e5); }
  function nextIdx() { for (var i = 0; i < D.months.length; i++) if (daysTo(D.months[i]) >= 0) return i; return -1; }
  function whenText(m) { var n = daysTo(m); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n > 1 ? 'In ' + n + ' days' : 'Held'; }
  function niceDate(m) { return dateOf(m).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function shortDate(m) { return dateOf(m).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }

  function fetchLive() {
    LIVE = load('bg_live', null);
    if (!online()) return;
    fetch(D.scriptUrl).then(function (r) { return r.json(); }).then(function (j) { if (j && j.ok) { LIVE = j; save('bg_live', j); render(true); } }).catch(function () {});
  }
  function post(body) {
    if (!online()) return Promise.resolve({ ok: true, offline: true });
    return fetch(D.scriptUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: 'network' }; });
  }
  function liveMonth(n) { return (LIVE && LIVE.months && LIVE.months[String(n)]) || { families: 0, people: 0, names: [], seva: {} }; }
  function presenterOf(m) { var l = liveMonth(m.n), p = (l.seva && l.seva.present) || []; return m.presenter || p[0] || ''; }

  var ROUTES = {
    home: ['Bharat', homePage, 'home'], year: ['The year', yearPage, 'year'], join: ['Join', joinPage, 'join'], seva: ['Volunteer', sevaPage, 'seva'],
    morning: ['A gathering morning', morningPage, 'more'], about: ['Why we gather', aboutPage, 'more'], questions: ['Life’s questions', questionsPage, 'more'],
    ask: ['Ask or offer', askPage, 'more'], prayers: ['Prayers', prayersPage, 'more'], promise: ['Our promise', promisePage, 'more'],
    downloads: ['Downloads', downloadsPage, 'more'], organiser: ['Organiser', organiserPage, 'more']
  };
  function route() {
    var id = (location.hash || '#home').slice(1).split('/')[0];
    var mm = /^month-(\d+)$/.exec(id);
    if (mm) { var i = +mm[1] - 1; if (D.months[i]) return { title: D.months[i].month + ': ' + D.months[i].topic, r: function () { return monthPage(i); }, tab: 'year' }; }
    var r = ROUTES[id] || ROUTES.home;
    return { title: r[0], r: r[1], tab: r[2] };
  }

  function arcHtml() {
    var ni = nextIdx();
    return '<div class="arc">' + D.months.map(function (m, i) {
      var cls = daysTo(m) < 0 ? 'done' : i === ni ? 'next' : '';

    x.fillStyle = '#e9b949'; x.font = '600 40px Fraunces, Georgia, serif'; x.fillText('Learn. Practise. Serve. Grow.', W / 2, 940);

    var sel = +((location.hash.split('/')[1]) || (up[0] && up[0].n) || 1), m = D.months[sel - 1] || D.months[0];
    var s = '<div class="eb">Everyone has a role</div><h1>Volunteer</h1><p>Every gathering is organised, presented and run by volunteers. Pick a role, even for one Sunday.</p>' +
      '<div class="band b-kumkum"><div class="eb">Present a topic</div><div class="disp" style="font-size:20px">Share what you know</div><p style="margin:4px 0 0">Any volunteer can sign up for any topic. You get a topic guide with the verses, stories, games and quiz.</p></div>' +
      '<div class="card">' + D.months.map(function (x) {
        var names = (liveMonth(x.n).seva || {}).present || [], on = !!MINE.seva[x.n + ':present'], past = daysTo(x) < 0;
        return '<div class="role"><span class="mk" style="width:14px;height:20px;border-radius:99px 99px 0 0;background:' + COLS[x.colour] + ';flex-shrink:0"></span><div class="info"><b>' + esc(x.topic) + '</b><div class="names">' + esc(shortDate(x)) +
          (x.presenter ? ' · Presenter: ' + esc(x.presenter) : names.length ? ' · Signed up: ' + names.map(esc).join(', ') : ' · Presenter needed') + '</div></div>' +
          (past ? '<span class="pill ok">Held</span>' : ME ? '<button class="btn small' + (on ? '' : ' primary') + '" data-act="' + (on ? 'unseva' : 'offer') + '" data-m="' + x.n + '" data-r="present">' + (on ? 'Withdraw' : 'Sign up') + '</button>' : '') + '</div>';
      }).join('') + (ME ? '' : '<p class="small" style="margin-top:10px"><a href="#join">Register</a> to sign up.</p>') + '</div><h2>Help on the day</h2>';
    if (up.length) {
      var live = liveMonth(m.n), need = 0, got = 0;
      D.roles.forEach(function (r) { if (r.id === 'present') return; need += r.need; got += Math.min(r.need, ((live.seva || {})[r.id] || []).length); });
      s += '<label class="f" for="svMonth">Gathering</label><select class="f" id="svMonth">' + up.map(function (x) { return '<option value="' + x.n + '"' + (x.n === m.n ? ' selected' : '') + '>' + esc(x.month + ': ' + x.topic) + '</option>'; }).join('') + '</select>' +
        '<div class="card"><div class="small"><b>' + got + ' of ' + need + '</b> places filled for ' + esc(m.topic) + '</div><div class="bar"><i style="width:' + Math.round(100 * got / need) + '%"></i></div>' +
        D.roles.filter(function (r) { return r.id !== 'present'; }).map(function (r) { return roleRow(m, r, live, true); }).join('') + (ME ? '' : '<p class="small" style="margin-top:10px"><a href="#join">Register</a> to sign up.</p>') + '</div>';
    }
    s += '<h2>Other ways to help</h2><ul><li>Lend durries, chairs, a sound system or a projector.</li><li>Open a hall, courtyard or auditorium for one morning.</li><li>Be the lane volunteer who personally invites 5–10 families each month.</li></ul>' +
      '<div class="card"><b>Seva Kosh.</b> A transparent box at every gathering meets printing and children’s materials. Giving is voluntary; accounts are shared every quarter.</div>' +
      '<div class="row"><a class="btn" href="#ask">Offer something else</a></div>';
    return s;
  }

  function morningPage() {
    return '<div class="eb">A gurukul with a modern touch</div><h1>A gathering morning</h1><p>' + esc(D.time) + ' at ' + esc(D.venue.name) + '.</p><table class="t">' +
      D.morning.map(function (r) { return '<tr><td style="width:60px;color:var(--kumkum);font-weight:700">' + r[0] + '</td><td><b>' + esc(r[1]) + '</b><br>' + esc(r[2]) + '</td></tr>'; }).join('') + '</table>' +
      '<h2>Four learning circles</h2><div class="grid2">' + tile('#year', 'b-saffron', 'Bal Gurukul', 'Children 8–14') + tile('#year', 'b-haldi', 'Yuva Sabha', 'Youth and families') +
      tile('#year', 'b-peacock', 'Karma Sabha', 'Professionals and civic leaders') + tile('#year', 'b-kumkum', 'Vriddha Sabha', 'Elders') + '</div>' +
      '<h2>Between gatherings</h2><ul><li><b>Week 1:</b> verse of the month on WhatsApp</li><li><b>Week 2:</b> a small family experiment</li><li><b>Week 3:</b> a youth-led bhajan jam or heritage walk</li><li><b>Week 4:</b> your lane volunteer invites you in person</li></ul>';
  }

  function aboutPage() {
    var lv = [['Vyakti', 'The individual', 'Focus, discipline, calm, character', 'saffron'], ['Parivar', 'The family', 'Respect, time together, shared values', 'haldi'], ['Samaj', 'The community', 'Seva, harmony, neighbours who care', 'peacock'], ['Rashtra', 'The nation', 'Pride, responsibility, Viksit Bharat 2047', 'kumkum']];
    return '<div class="eb">Why we gather</div><h1>Grow yourself. Grow together.</h1><p>A better person makes a better family, a stronger community and a greater nation.</p>' +
      lv.map(function (l) { return '<div class="band b-' + l[3] + '"><span class="disp" style="font-size:20px">' + l[0] + '</span> <b>' + l[1] + '</b><div>' + l[2] + '</div></div>'; }).join('') +
      '<h2>Four pillars</h2><table class="t"><tr><td><b>Wisdom</b> <i>(jñāna)</i></td><td>Who am I, and what is worth pursuing?</td></tr><tr><td><b>Life management</b> <i>(swadharma)</i></td><td>Discipline, balance, focus and calm</td></tr>' +
      '<tr><td><b>Human management</b> <i>(sambandha)</i></td><td>Family, respect, empathy and service</td></tr><tr><td><b>Complete management</b> <i>(rājadharma)</i></td><td>Ethical leadership of teams and communities</td></tr></table>' +
      '<div class="band b-saffron" style="margin-top:16px"><div class="disp" style="font-size:19px">No fees. No sponsors. Only seva.</div>Every gathering is organised, presented and run by volunteers from our neighbourhood.</div>';
  }

  function questionsPage() {
    return '<div class="eb">Answered by the Ramayana and Mahabharata</div><h1>Life’s questions, answered by our heritage</h1>' +
      '<p class="small muted">Ramayana references follow Valmiki (Gita Press sarga numbers); Mahabharata references follow the BORI critical edition (CE chapter.verse).</p>' +
      D.lifeQuestions.map(function (q) { return '<div class="card"><b>' + esc(q.question) + '</b><div>' + esc(q.episode) + '</div><div class="small" style="color:var(--kumkum);font-weight:700">' + esc(q.source) + '</div></div>'; }).join('') +
      '<h2>Every story, with its source</h2><p>The Lakshman Rekha, Shabari tasting the berries and the squirrel at Rama Setu come from later retellings, not Valmiki. We quote only the first half of <i>ahiṁsā paramo dharmaḥ</i>, and cite <i>dharmo rakṣati rakṣitaḥ</i> as Draupadi’s words (CE 3.31.7).</p>';
  }

  function askPage() {
    return '<div class="eb">We are listening</div><h1>Ask or offer</h1><form id="askForm" novalidate>' +
      '<label class="f" for="aKind">What is it?</label><select class="f" id="aKind"><option>A question on a topic</option><option>I would like to present a topic</option><option>I would like to lead a circle</option><option>I would like to sing, dance or perform</option><option>I can lend or offer something</option><option>Suggestion</option></select>' +
      '<label class="f" for="aMonth">For which gathering?</label><select class="f" id="aMonth"><option value="">Any</option>' + D.months.map(function (m) { return '<option value="' + m.n + '">' + esc(m.month + ': ' + m.topic) + '</option>'; }).join('') + '</select>' +
      (ME ? '' : '<label class="f" for="aName">Your name</label><input class="f" id="aName"><label class="f" for="aPhone">Mobile number</label><input class="f" id="aPhone" type="tel" inputmode="tel">') +
      '<label class="f" for="aText">Your message</label><textarea class="f" id="aText" maxlength="1000"></textarea><div style="margin-top:12px"><button class="btn primary" type="submit">Send</button></div></form>';
  }

  function prayersPage() {
    var pr = [['ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः शान्तिः शान्तिः ॥', 'Opening invocation (Katha and Taittiriya Upanishads): may we learn together, grow together, and never be hostile to one another.'],
      ['ॐ भूर्भुवः स्वः । तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् ॥', 'Gayatri, Rigveda 3.62.10: may the divine light inspire our minds.'],
      ['असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय ॥', 'Brihadaranyaka Upanishad 1.3.28: lead me from untruth to truth, darkness to light, death to immortality.'],
      ['सं गच्छध्वं सं वदध्वं सं वो मनांसि जानताम् ॥', 'Rigveda 10.191.2: walk together, speak together, let your minds be in harmony.'],
      ['सर्वे भवन्तु सुखिनः । सर्वे सन्तु निरामयाः । सर्वे भद्राणि पश्यन्तु । मा कश्चिद् दुःखभाग्भवेत् ॥', 'Closing prayer: may all be happy, may all be free from illness, may all see good, may no one suffer.']];
    return '<div class="eb">Prayers we share</div><h1>Mantras for the year</h1>' + pr.map(function (p) { return '<div class="card"><div class="dev" style="font-size:20px;line-height:1.7">' + p[0] + '</div><div class="small muted">' + p[1] + '</div></div>'; }).join('');
  }

  function promisePage() {
    return '<div class="eb">Our promise to families</div><h1>Safe and respectful</h1><ul>' +
      ['Every volunteer signs a short code of conduct.', 'No volunteer is ever alone with a child.', 'Photos only with written consent; no child is named or tagged online.', 'No shouting, punishment or humiliation, ever.',
       'Concerns go to our safeguarding contact: ' + D.safeguardingContact + '.', 'Every family is welcome.', 'Chairs, a microphone and large print for anyone who needs them.']
        .map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
  }

  function downloadsPage() {
    var f = [['Handbook for everyone (A5, 40 pages)', 'docs/Bharat-Handbook-A5.pdf'], ['Trifold brochure (A4)', 'docs/Bharat-Brochure-Trifold.pdf'], ['Year schedule poster (A3)', 'docs/Bharat-Year-Schedule-A3.pdf'], ['January poster (A4)', 'docs/Bharat-Launch-Poster-A4.pdf']];
    var g = 'https://github.com/jitendraGPE/bharat-gurukul/blob/main/docs/', t = [['The plan', 'plan.md'], ['Topic guides for presenters (all 12 months)', 'topic-guides.md'], ['Letters and templates (delegate invitation and more)', 'letters-and-templates.md']];
    return '<div class="eb">Print and share</div><h1>Downloads</h1>' + f.map(function (x) { return '<div class="card"><a href="' + x[1] + '" download>' + esc(x[0]) + '</a></div>'; }).join('') +
      '<h2>For organisers and presenters</h2>' + t.map(function (x) { return '<div class="card"><a href="' + g + x[1] + '" target="_blank" rel="noopener">' + esc(x[0]) + '</a></div>'; }).join('') +
      '<h2>Contact</h2><p>' + esc(D.contact.name) + ' · ' + esc(D.contact.phone) + '<br>' + esc(D.venue.name) + ', ' + esc(D.venue.address) + '</p>';
  }

  function organiserPage() {
    var key = sessionStorage.getItem('bg_key');
    var s = '<div class="eb">Organisers only</div><h1>Organiser tools</h1>';
    if (!online()) return s + '<div class="notice">Add the Apps Script /exec address to programme.json first.</div>';
    if (!key) return s + '<form id="keyForm"><label class="f" for="kIn">Organiser key</label><input class="f" id="kIn" type="password" autocomplete="off"><div style="margin-top:12px"><button class="btn primary">Unlock</button></div></form><p class="small muted">The key is set in the Google Sheet’s Apps Script properties. It is never stored in this website.</p>';
    s += '<p class="small muted">Phone numbers and messages are only in the Google Sheet. Use Gurukul > Rebuild reports there for dashboards.</p>';
    D.months.forEach(function (m) {
      var l = liveMonth(m.n);
      s += '<h3>' + esc(m.month + ': ' + m.topic) + '</h3><p class="small">' + l.families + ' families · ' + l.people + ' people</p>';
      l.names.forEach(function (nm) { s += '<div class="role"><div class="info">' + esc(nm) + '</div><button class="btn small" data-act="orgRsvp" data-m="' + m.n + '" data-n="' + esc(nm) + '">Remove RSVP</button></div>'; });
      D.roles.forEach(function (r) { ((l.seva || {})[r.id] || []).forEach(function (nm) { s += '<div class="role"><div class="info">' + esc(nm) + ' <span class="small muted">· ' + esc(r.name) + '</span></div><button class="btn small" data-act="orgSeva" data-m="' + m.n + '" data-r="' + r.id + '" data-n="' + esc(nm) + '">Remove</button></div>'; }); });
    });
    return s + '<div style="margin-top:16px"><button class="btn" data-act="lock">Lock</button></div>';
  }

  function moreMenu() {
    var items = [['#about', 'Why we gather'], ['#morning', 'A gathering morning'], ['#questions', 'Life’s questions'], ['#ask', 'Ask or offer'], ['#prayers', 'Prayers'], ['#promise', 'Our promise'], ['#downloads', 'Downloads']];
    return '<div class="eb">More</div><div class="menu">' + items.map(function (x) { return '<a href="' + x[0] + '">' + esc(x[1]) + '</a>'; }).join('') + '</div>' +
      '<h3>The twelve gatherings</h3><div class="menu">' + D.months.map(function (m) { return '<a href="#month-' + m.n + '"><span style="display:inline-block;width:12px;height:16px;border-radius:99px 99px 0 0;background:' + COLS[m.colour] + '"></span>' + esc(m.month + ': ' + m.topic) + '</a>'; }).join('') + '</div>';
  }

  var lastKey = '';
  function render(soft) {
    if (!D) return;
    var h = (location.hash || '#home').slice(1).split('/'), key = h[0];
    if (key === 'more') { openDrawer(); return; }
    var r = route(), scroll = $('main').scrollTop;
    $('page').innerHTML = r.r();
    $('topTitle').textContent = r.title;
    document.title = (r.title === 'Bharat' ? '' : r.title + ' · ') + 'Bharat';
    document.querySelectorAll('nav.tabs a').forEach(function (a) { if (a.dataset.tab === r.tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    wire();
    if (soft && key === lastKey) { $('main').scrollTop = scroll; return; }
    lastKey = key;
    var anchor = h[1] && isNaN(+h[1]) && document.getElementById(h[1]);
    if (anchor) anchor.scrollIntoView(); else $('main').scrollTop = 0;
  }
  window.addEventListener('hashchange', function () { closeDrawer(); render(); });

  function openDrawer() { $('drawerPanel').innerHTML = moreMenu(); $('drawer').classList.add('open'); $('moreTab').setAttribute('aria-expanded', 'true'); var a = $('drawerPanel').querySelector('a'); if (a) a.focus(); }
  function closeDrawer() { $('drawer').classList.remove('open'); $('moreTab').setAttribute('aria-expanded', 'false'); }
  $('moreTab').addEventListener('click', function (e) { e.preventDefault(); $('drawer').classList.contains('open') ? closeDrawer() : openDrawer(); });
  $('drawer').addEventListener('click', function (e) { if (e.target === $('drawer') || e.target.closest('a')) closeDrawer(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('drawer').classList.contains('open')) { closeDrawer(); $('moreTab').focus(); } });

  function shareText() {
    var h = (location.hash || '').slice(1).split('/')[0], mm = /^month-(\d+)$/.exec(h), base = location.href.split('#')[0];
    var m = mm ? D.months[+mm[1] - 1] : D.months[Math.max(0, nextIdx())];
    return '🚩 ' + D.title + '\n' + m.month + ': ' + m.topic + ' — ' + m.theme + '\n' + niceDate(m) + ', ' + D.time + ', ' + D.venue.name +
      '\nFree, and run entirely by volunteers. Come with your family: ' + base + '#month-' + m.n;
  }
  function share() { window.open('https://wa.me/?text=' + encodeURIComponent(shareText()), '_blank', 'noopener'); }
  $('shareBtn').onclick = share;

  function wire() {
    var page = $('page');
    page.querySelectorAll('[data-step]').forEach(function (b) { b.onclick = function () { var o = $(b.dataset.step); o.textContent = Math.max(0, Math.min(20, (+o.textContent || 0) + (+b.dataset.d))); }; });
    page.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { act(b); }; });
    page.querySelectorAll('.chips a').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); var el = $(a.getAttribute('href').split('/')[1]); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }; });
    var sv = $('svMonth'); if (sv) sv.onchange = function () { location.hash = '#seva/' + sv.value; };
    var rf = $('regForm'); if (rf) rf.onsubmit = function (e) { e.preventDefault(); register(); };
    var af = $('askForm'); if (af) af.onsubmit = function (e) { e.preventDefault(); ask(); };
    var kf = $('keyForm'); if (kf) kf.onsubmit = function (e) {
      e.preventDefault(); var k = $('kIn').value.trim();
      post({ action: 'checkKey', key: k }).then(function (j) { if (j.ok) { sessionStorage.setItem('bg_key', k); fetchLive(); render(); } else toast('That key did not match.'); });
    };
  }

  function act(b) {
    var a = b.dataset.act, mn = b.dataset.m, m = mn && D.months[+mn - 1];
    if (a === 'share') return share();
    if (a === 'lock') { sessionStorage.removeItem('bg_key'); return render(); }
    if (a === 'offer') {
      if (!ME) { toast('Register first, then offer to present.'); location.hash = '#join'; return; }
      b.dataset.r = 'present'; a = 'seva';
    }
    if (a === 'quiz') {
      var st = QUIZ[mn] || {}; st[+b.dataset.q] = +b.dataset.o; QUIZ[mn] = st; save('bg_quiz', QUIZ);
      $('quizBox').innerHTML = quizHtml(m); wire(); return;
    }
    if (a === 'quizReset') { delete QUIZ[mn]; save('bg_quiz', QUIZ); $('quizBox').innerHTML = quizHtml(m); wire(); return; }
    if (a === 'cert') {
      var nm = ($('certName').value || '').trim().slice(0, 60);
      if (!nm) { $('certName').focus(); return toast('Please enter a name.'); }
      (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { makeCert(m, nm); toast('Certificate downloaded.'); });
      return;
    }
    if (a === 'tick') {
      var t = TICKS[mn] || []; t[+b.dataset.d] = !t[+b.dataset.d]; TICKS[mn] = t; save('bg_ticks', TICKS);
      b.setAttribute('aria-pressed', String(!!t[+b.dataset.d]));
      var done = t.filter(Boolean).length, card = b.closest('.card');
      card.querySelector('[data-count]').textContent = done + ' of 30 days · saved on this phone'; card.querySelector('.bar i').style.width = Math.round(done / 30 * 100) + '%';
      if (done === 30) toast('30 days complete. Well done!');
      return;
    }
    if (a === 'rsvp' || a === 'unrsvp') {
      var ad = a === 'rsvp' ? +$('ra').textContent : 0, ch = a === 'rsvp' ? +$('rc').textContent : 0;
      if (a === 'rsvp' && ad + ch === 0) return toast('Add at least one person.');
      b.disabled = true;
      post({ action: 'rsvp', name: ME.name, phone: ME.phone, month: mn, topic: m.topic, adults: ad, children: ch }).then(function (j) {
        if (!j.ok) { b.disabled = false; return toast('Could not send. Please try again.'); }
        if (a === 'rsvp') MINE.rsvp[mn] = { a: ad, c: ch, sent: true }; else delete MINE.rsvp[mn];
        save('bg_mine', MINE); toast(a === 'rsvp' ? 'See you on ' + niceDate(m) + '!' : 'Noted. We’ll miss you.'); fetchLive(); render(true);
      });
      return;
    }
    if (a === 'seva' || a === 'unseva') {
      var role = D.roles.filter(function (r) { return r.id === b.dataset.r; })[0];
      b.disabled = true;
      post({ action: a, name: ME.name, phone: ME.phone, month: mn, topic: m.topic, role: role.id, roleName: role.name }).then(function (j) {
        if (!j.ok) { b.disabled = false; return toast('Could not send. Please try again.'); }
        var k = mn + ':' + role.id; if (a === 'seva') MINE.seva[k] = true; else delete MINE.seva[k];
        save('bg_mine', MINE);
        toast(a === 'unseva' ? 'Withdrawn.' : role.id === 'present' ? 'Thank you! An organiser will send you the topic guide.' : 'Thank you for volunteering!');
        fetchLive(); render(true);
      });
      return;
    }
    if (a === 'orgRsvp' || a === 'orgSeva') {
      if (!confirm('Remove ' + b.dataset.n + '?')) return;
      post({ action: a === 'orgRsvp' ? 'removeRsvp' : 'removeSeva', key: sessionStorage.getItem('bg_key'), name: b.dataset.n, month: mn, role: b.dataset.r }).then(function (j) {
        toast(j.ok ? 'Removed.' : 'Not removed: ' + (j.error || 'error')); fetchLive();
      });
    }
  }

  function register() {
    var name = $('fName').value.trim(), phone = $('fPhone').value.trim();
    if (!name) { $('fName').focus(); return toast('Please enter a name.'); }
    if (digits(phone).length < 8) { $('fPhone').focus(); return toast('Please enter a valid mobile number.'); }
    var circles = []; for (var i = 0; i < 4; i++) { var c = $('c' + i); if (c && c.checked) circles.push(c.value); }
    var me = { name: name, phone: phone, area: $('fArea').value.trim(), adults: +$('fa').textContent, children: +$('fc').textContent, circles: circles, photo: $('fPhoto').checked };
    post({ action: 'register', name: me.name, phone: me.phone, area: me.area, adults: me.adults, children: me.children, circles: me.circles, photoConsent: me.photo }).then(function (j) {
      if (!j.ok) return toast('Could not register. Please try again.');
      var first = !ME; ME = me; save('bg_me', ME); toast(first ? 'Welcome, ' + name + '!' : 'Saved.'); fetchLive();
      var ni = nextIdx(); location.hash = ni >= 0 ? '#month-' + D.months[ni].n + '/join' : '#home';
    });
  }

  function ask() {
    var text = $('aText').value.trim(); if (!text) { $('aText').focus(); return toast('Please write your message.'); }
    var name = ME ? ME.name : $('aName').value.trim(), phone = ME ? ME.phone : $('aPhone').value.trim();
    if (!name || digits(phone).length < 8) return toast('Please add your name and mobile number.');
    post({ action: 'ask', name: name, phone: phone, month: $('aMonth').value, kind: $('aKind').value, text: text }).then(function (j) {
      if (!j.ok) return toast('Could not send. Please try again.');
      $('aText').value = ''; toast('Thank you. The organisers will see this.');
    });
  }

  fetch('programme.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) { D = d; fetchLive(); render(); })
    .catch(function () { $('page').innerHTML = '<p>Could not load the programme. Please check your connection and reload.</p>'; });
})();
</script>
</body>
</html>
